name: casinworks_portal
description: CasinWorks client portal and gig board (iOS / Android).
publish_to: "none"
version: 1.0.0+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  url_launcher: ^6.3.2
  file_picker: ^8.3.7
  google_fonts: ^6.3.2
  add_2_calendar: ^3.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
